    <style>
/* ---
Theme: Vibrant Professional (Arsh Diagnostics Center)
Primary Color: #4f46e5 (Indigo)
Accent Color: #06b6d4 (Cyan)
Success Color: #10b981 (Emerald)
--- */

/* --- Global Styles & Variables --- */
:root {
    --primary-color: #4f46e5;
    --primary-hover: #4338ca;
    --secondary-color: #64748b;
    --secondary-hover: #475569;
    --danger-color: #ef4444;
    --danger-hover: #dc2626;
    --success-color: #10b981;
    --success-hover: #059669;
    --warning-color: #f59e0b;
    --accent-color: #06b6d4;
    --accent-hover: #0891b2;
    --pink-color: #ec4899;
    /* NEW WhatsApp Color */
    --whatsapp-color: #25D366;
    --whatsapp-hover: #1DA851;
    --light-color: #eef2ff;
    --dark-color: #1e1b4b;
    --text-color: #475569;
    --sidebar-bg: #ffffff;
    --main-bg: #f5f6fd;
    --border-color: #e2e5f5;
    --card-shadow: 0 5px 18px rgba(79, 70, 229, 0.08);
    --card-radius: 12px;
    --gradient-primary: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
    --gradient-warm: linear-gradient(135deg, #f59e0b 0%, #ec4899 100%);
}

/* --- Base & Typography --- */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Roboto', sans-serif;
    background-color: var(--main-bg);
    color: var(--text-color);
    display: flex;
    min-height: 100vh;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}
h2 { font-size: 1.6rem; font-weight: 500; color: var(--primary-color); }
h3 { font-size: 1.5rem; color: var(--dark-color); margin-bottom: 0; }
h4 {
    font-size: 1rem;
    color: var(--dark-color);
    font-weight: 500;
    margin-bottom: 1.5rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--border-color);
}
p { line-height: 1.6; }
hr { border: 0; border-top: 1px solid var(--border-color); margin: 2rem 0; }
.error-message { color: var(--danger-color); margin-top: 1rem; min-height: 1.2em; }

/* --- Login Page --- */
.login-container {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    min-height: 100vh;
    background: var(--gradient-primary);
}
.login-card {
    background-color: #ffffff;
    padding: 3rem;
    border-radius: var(--card-radius);
    box-shadow: 0 20px 50px rgba(30, 27, 75, 0.25);
    text-align: center;
    width: 100%;
    max-width: 420px;
    animation: fadeIn 0.5s ease-out;
    border-top: 6px solid transparent;
    border-image: var(--gradient-primary) 1;
}
.login-header { margin-bottom: 2rem; }
.login-header p { color: var(--secondary-color); font-size: 1rem; }
.lab-logo-login {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 1rem;
    border: 3px solid var(--light-color);
    box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
}

/* --- Main Layout & TAB FIX --- */
@keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
.container {
    display: flex;
    width: 100%;
    min-height: 100vh;
}
.sidebar {
    width: 260px;
    background-color: var(--sidebar-bg);
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    border-right: 1px solid var(--border-color);
    transition: width 0.3s ease;
}
.main-content {
    flex-grow: 1;
    padding: 2.5rem;
    overflow-y: auto;
}
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2.5rem;
}
.header p { color: var(--secondary-color); font-size: 0.9rem; }

/* Hides inactive tabs */
.tab-content { display: none; }
/* Shows only the active tab */
.tab-content.active { display: block; animation: fadeIn 0.4s ease-out; }

/* --- Sidebar Navigation --- */
.lab-header {
    text-align: center;
    margin: -1.5rem -1.5rem 1.5rem -1.5rem;
    padding: 1.5rem 1rem;
    background: var(--gradient-primary);
    border-radius: 0 0 16px 16px;
}
.lab-header h2 { font-size: 1.2rem; margin-top: 0.5rem; color: #ffffff; }
.lab-logo {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}
.nav-links {
    list-style: none;
    width: 100%;
    flex-grow: 1;
}
.nav-links a {
    display: flex;
    align-items: center;
    color: var(--text-color);
    text-decoration: none;
    padding: 0.9rem 1rem;
    border-radius: 8px;
    margin-bottom: 0.5rem;
    transition: all 0.2s ease;
    font-weight: 500;
}
.nav-links a i {
    margin-right: 15px;
    width: 20px;
    text-align: center;
    font-size: 1rem;
    color: var(--secondary-color);
    transition: color 0.2s ease;
}
.nav-links a:hover {
    background-color: var(--light-color);
    color: var(--primary-color);
}
.nav-links a:hover i {
    color: var(--primary-color);
}
.nav-links a.active {
    background: var(--gradient-primary);
    color: #ffffff;
    box-shadow: 0 6px 14px rgba(79, 70, 229, 0.35);
}
.nav-links a.active i {
    color: #ffffff;
}

.sidebar-footer {
    padding-top: 1.5rem;
    border-top: 1px solid var(--border-color);
    text-align: center;
}
.sidebar-footer .btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}
.sidebar-footer .btn i { margin-right: 10px; }

/* --- Cards & Forms --- */
.card {
    background-color: #ffffff;
    padding: 2rem;
    border-radius: var(--card-radius);
    box-shadow: var(--card-shadow);
    margin-bottom: 2rem;
}
.form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 1.5rem;
    margin-bottom: 1.5rem;
}
.form-group { margin-bottom: 1rem; }
.form-group label {
    display: block;
    margin-bottom: 0.6rem;
    font-weight: 500;
    color: var(--dark-color);
    font-size: 0.95rem;
}
.form-group input[type="text"],
.form-group input[type="number"],
.form-group input[type="tel"],
.form-group input[type="email"],
.form-group input[type="password"],
.form-group input[type="date"],
.form-group input[type="month"],
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 0.8rem 1rem;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    font-size: 1rem;
    color: var(--text-color);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    outline: none;
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(44, 62, 80, 0.1);
}
.form-group textarea { resize: vertical; min-height: 80px; }

.btn {
    padding: 0.8rem 1.5rem;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 500;
    transition: background-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
.btn i { margin-right: 8px; }
.btn-primary { background: var(--gradient-primary); color: #fff; }
.btn-primary:hover { filter: brightness(1.08); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35); }
.btn-secondary { background-color: var(--secondary-color); color: #fff; }
.btn-secondary:hover { background-color: var(--secondary-hover); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); }
.btn-danger { background-color: var(--danger-color); color: #fff; }
.btn-danger:hover { background-color: var(--danger-hover); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); }
.btn-success { background-color: var(--success-color); color: #fff; }
.btn-success:hover { background-color: var(--success-hover); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); }
.btn-info { background-color: var(--accent-color); color: #fff; }
.btn-info:hover { background-color: var(--accent-hover); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); }
.btn-whatsapp { background-color: var(--whatsapp-color); color: #fff; }
.btn-whatsapp:hover { background-color: var(--whatsapp-hover); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); }

.btn-full { width: 100%; }
.btn-sm {
    padding: 0.5rem 1rem;
    font-size: 0.85rem;
    border-radius: 6px;
}
.form-buttons {
    display: flex;
    gap: 1rem;
    margin-top: 2rem;
    justify-content: flex-end;
    flex-wrap: wrap;
}

/* --- Investigation Specific --- */
.investigation-row {
    display: flex;
    gap: 1rem;
    align-items: flex-end;
    margin-bottom: 1rem;
    flex-wrap: wrap;
}
.investigation-row .form-group {
    flex: 1;
    min-width: 180px;
    margin-bottom: 0;
}
.investigation-row .btn { flex-shrink: 0; }

.billing-summary .form-group input {
    font-weight: bold;
    background-color: var(--light-color);
}

/* --- Table Styles --- */
.table-responsive {
    overflow-x: auto;
    width: 100%;
    margin-top: 1.5rem;
}
.data-table {
    width: 100%;
    border-collapse: collapse;
    background-color: #ffffff;
    border-radius: var(--card-radius);
    overflow: hidden; /* Ensures rounded corners apply to table */
}
.data-table th, .data-table td {
    padding: 1rem 1.2rem;
    border-bottom: 1px solid var(--border-color);
    text-align: left;
    white-space: nowrap; /* Prevent wrapping in cells */
}
.data-table th {
    background: var(--gradient-primary);
    color: #fff;
    font-weight: 500;
    font-size: 0.9rem;
    text-transform: uppercase;
}
.data-table tbody tr:last-child td { border-bottom: none; }
.data-table tbody tr:hover { background-color: var(--light-color); }
.data-table td .btn { margin-right: 0.5rem; }

/* --- Dashboard Specific --- */
.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 2rem;
    margin-bottom: 2rem;
}
.dashboard-grid .card {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    padding: 1.5rem;
    text-align: left;
    border-left: 4px solid var(--primary-color);
}
.card-icon {
    font-size: 2.5rem;
    color: var(--primary-color);
    width: 50px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background-color: rgba(79, 70, 229, 0.1);
}
.card-icon.revenue { color: var(--success-color); background-color: rgba(16, 185, 129, 0.12); }
.dashboard-grid .card:has(.card-icon.revenue) { border-left-color: var(--success-color); }
.card-icon.pending { color: var(--warning-color); background-color: rgba(245, 158, 11, 0.12); }
.dashboard-grid .card:has(.card-icon.pending) { border-left-color: var(--warning-color); }
.card-icon.alert { color: var(--danger-color); background-color: rgba(239, 68, 68, 0.12); }
.dashboard-grid .card:has(.card-icon.alert) { border-left-color: var(--danger-color); }

.card-content h4 {
    margin-bottom: 0.5rem;
    font-size: 1.1rem;
    border-bottom: none;
    padding-bottom: 0;
}
.card-content p {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--dark-color);
}
.activity-list { list-style: none; padding: 0; }
.activity-list li {
    padding: 0.75rem 0;
    border-bottom: 1px dashed var(--border-color);
    font-size: 0.95rem;
    color: var(--text-color);
}
.activity-list li:last-child { border-bottom: none; }

/* --- Doctor Management --- */
.doctor-form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 1.5rem;
    margin-bottom: 1.5rem;
}
.form-group-span-all {
    grid-column: 1 / -1; /* Spans across all columns */
}


/* --- Combined Layout for Expenses & Inventory --- */
.combined-tab-layout {
    display: grid;
    grid-template-columns: 1fr 1fr; /* Two columns */
    gap: 2rem;
}

.report-controls { display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; }
.radio-group { display: flex; gap: 1rem; align-items: center; border: 1px solid var(--border-color); padding: 0.5rem 1rem; border-radius: 8px; }
.radio-group label { margin: 0 0.5rem 0 0.2rem; cursor: pointer; }
#report-output h5 { border-bottom: 2px solid var(--success-color); padding-bottom: 0.5rem; margin: 2rem 0 1rem 0; color: var(--primary-color); }
#report-output h5 span { font-weight: normal; color: var(--text-color); }

/* --- Responsive --- */
@media (max-width: 1200px) {
    .combined-tab-layout {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 768px) {
    body { font-size: 14px; }
    .container { flex-direction: column; }
    .sidebar {
        width: 100%;
        height: auto;
        flex-direction: row;
        justify-content: flex-start;
        align-items: center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        padding: 0.5rem 1rem;
    }
    .sidebar .lab-header { display: none; } /* Hide logo and title on small screens */
    .sidebar .nav-links {
        flex-direction: row;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        white-space: nowrap;
        padding-bottom: 0.5rem;
        flex-grow: 0;
    }
    .sidebar .nav-links li { display: inline-block; }
    .sidebar .nav-links a {
        padding: 0.7rem 0.8rem;
        font-size: 0.85rem;
        margin-bottom: 0;
    }
    .sidebar .nav-links a i { margin-right: 8px; font-size: 0.9rem; }
    .sidebar-footer {
        width: auto;
        border-top: none;
        padding-top: 0;
        margin-left: auto; /* Push logout button to the right */
    }
    .sidebar-footer .btn { width: auto; padding: 0.7rem 1rem; font-size: 0.85rem; }

    .main-content { padding: 1.5rem; }
    .header { flex-direction: column; align-items: flex-start; margin-bottom: 1.5rem; }
    .header h3 { margin-bottom: 0.5rem; }
    .dashboard-grid, .form-grid, .doctor-form-grid { grid-template-columns: 1fr; gap: 1rem; }
    .card { padding: 1.5rem; }
    .form-buttons { justify-content: center; }
    .record-actions { flex-direction: column; align-items: stretch; gap: 1rem; }
    .record-actions input, .record-actions button, .record-actions .date-range-export { width: 100%; }
    .investigation-row { flex-direction: column; align-items: stretch; gap: 1rem; }
    .investigation-row .form-group { min-width: unset; }
    .investigation-row .btn { width: 100%; }
    .date-range-export { flex-direction: column; align-items: stretch; }
    .report-controls { flex-direction: column; align-items: stretch; }
    .report-controls .form-group, .report-controls .radio-group, .report-controls button { width: 100%; }
}

@media (max-width: 480px) {
    .login-card { padding: 2rem; }
    .login-header h2 { font-size: 1.4rem; }
    .btn { padding: 0.7rem 1rem; font-size: 0.9rem; }
    .form-group label { font-size: 0.9rem; }
    .form-group input, .form-group select, .form-group textarea { padding: 0.6rem 0.8rem; font-size: 0.9rem; }
    .data-table th, .data-table td { padding: 0.8rem 1rem; font-size: 0.85rem; }
    .card-content p { font-size: 1.5rem; }
}

        /* --- Page-specific additions --- */
        .record-actions {
            display: flex;
            justify-content: space-between;
            align-items: flex-end; 
            flex-wrap: wrap;
            gap: 1.5rem;
        }
        .date-range-export {
            display: flex;
            align-items: flex-end;
            gap: 1rem;
            flex-wrap: wrap;
            border: 1px solid #dee2e6;
            padding: 1rem;
            border-radius: 8px;
            background-color: #f8f9fa;
        }
        .date-range-export .form-group {
            margin-bottom: 0;
        }
        .form-grid-condensed {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }
        .data-table td .btn {
            margin-bottom: 4px;
        }
        /* Styles for the new Test Report tab */
        #test-report-generator {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
        }
        #report-patient-tests .test-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid #eee;
        }
        #printable-report-area { display: none; }

        @media print {
            body * { visibility: hidden; }
            #printable-report-area, #printable-report-area * { visibility: visible; }
            #printable-report-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                padding: 20px;
                font-size: 12pt;
            }
            .report-header h1 { font-size: 24pt; }
        }
    </style>
</head>

                <h2>Arsh Diagnostics Center</h2>
